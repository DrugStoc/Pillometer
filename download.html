<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="public/favicon.ico" />
    <title>Pillometer | Download</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Discover Pillometer, the ultimate pharmacy operating system designed for seamless inventory management. Watch our video to see how it can transform your pharmacy's efficiency."
    />
    <link rel="stylesheet" type="text/css" href="./css/fonts.css" />
    <link rel="stylesheet" type="text/css" href="./css/download.css" />
  </head>
  <body>
    <nav class="navigator-class">
      <a href="index.html">
        <img src="public/images/pillometer-icon.svg" alt="Brand Image" class="pill-icon" />
      </a>
      <a class="navigator-button">Preorder here</a>
    </nav>

    <div class="download-body">
      <div class="download-box">
        <img src="public/images/pillometer-tl.svg" alt="Brand Image" class="pillometer-tl" /> 
        <img src="public/images/pillometer-tr.svg" alt="Brand Image" class="pillometer-tr" /> 
        <img src="public/images/pillometer-bl.svg" alt="Brand Image" class="pillometer-bl" />        

        <div class="download-header">
          <a href="index.html">
            <img
              src="public/images/arrow-back.svg"
              alt="Go back"
              class="arrow-back"
            />
          </a>
          <span class="download-header-text">Pillometer download</span>
          <span></span>
        </div>

        <div class="download-cards">

          <!-- PC -->
          <div class="download-card">
            <div class="download-image">
              <img src="public/images/macbook.png" alt="Brand Image" class="mac-image" /> 
            </div>
            <div class="download-details">
              <p class="download-category">Desktop App</p>
              <div class="download-text-row">
                <span class="download-text">Desktop app for Windows</span>
                <img src="public/images/download.svg" alt="Brand Image" class="download-svg" />
              </div>
            </div>
          </div>

          <!-- Mobile -->
          <div class="download-card">
            <div class="download-image">
              <img src="public/images/mobile-showcase.png" alt="Brand Image" class="mobile-image" />
            </div>
            <div class="download-details">
              <p class="download-category">Desktop App</p>
              <div class="download-text-row">
                <span class="download-text">Desktop app for Windows</span>
                <img src="public/images/download.svg" alt="Brand Image" class="download-svg" />
              </div>
            </div>
          </div>

          <!-- Mobile -->
          <div class="download-card">
            <div class="download-image">
              <img src="public/images/pillometer-showcase.png" alt="Brand Image" class="mobile-image" />
            </div>
            <div class="download-details">
              <p class="download-category">Desktop App</p>
              <div class="download-text-row">
                <span class="download-text">Desktop app for Windows</span>
                <img src="public/images/download.svg" alt="Brand Image" class="download-svg" />
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </body>
</html>
